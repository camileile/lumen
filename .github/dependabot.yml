version: 2
updates:
  - package-ecosystem: npm
    directory: /lumen-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Major upgrades are planned deliberately, with their own testing scope.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /lumen-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Prisma 7, TypeScript 7 and other majors are planned deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
